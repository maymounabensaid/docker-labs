services:
  db:
    build: ./db
    image: todo-db
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: ./app
    image: todo-web
    env_file: .env
    environment:
      DB_HOST: db                     # the service name is the DNS hostname
    ports:
      - "8080:5000"
    depends_on:
      db
    restart: unless-stopped

  pgadmin:                            # part 6
    image: dpage/pgadmin4
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
